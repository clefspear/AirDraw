<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AirDraw - Vanilla JS</title>
  <link rel="stylesheet" href="/src/css/styles.css" />
</head>
<body>
  <canvas id="draw-canvas"></canvas>

  <div class="camera-container">
    <video id="webcam-video" autoplay playsinline muted></video>
    <div id="camera-dot"></div>
    <div id="camera-fingers" style="position:absolute;top:8px;left:8px;z-index:10;background:rgba(255,255,255,0.8);color:#d00;font-weight:bold;padding:2px 8px;border-radius:4px;font-size:16px;pointer-events:none;"></div>
  </div>

  <div id="pointer">
    <div id="pointer-circle"></div>
    <img src="./icons/pen.svg" alt="Pen Icon" id="pen-icon" />
  </div>

  <div id="tools">
    <button id="pen-btn" class="active">Pen</button>
    <button id="eraser-btn">Eraser</button>
  </div>

  <div id="debug-info" style="position:fixed;bottom:10px;left:10px;z-index:2000;background:rgba(255,255,255,0.9);padding:8px 12px;border-radius:6px;font-size:14px;font-family:monospace;box-shadow:0 2px 8px rgba(0,0,0,0.08);max-width:40vw;white-space:pre-wrap;"></div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script type="module" src="/src/js/mediapipeHands.js"></script>
  <script type="module" src="/src/js/camera.js"></script>
  <script type="module" src="/src/js/app.js"></script>
</body>
</html>
