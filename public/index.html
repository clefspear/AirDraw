<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AirDraw - Vanilla JS</title>
  <link rel="stylesheet" href="/src/css/styles.css" />
</head>
<body>
  <canvas id="draw-canvas"></canvas>

  <div class="camera-container">
    <video id="webcam-video" autoplay playsinline muted></video>
    <div id="camera-fingers">No hand</div>
  </div>

  <div id="pointer">
    <div id="pointer-circle"></div>
    <img src="./icons/pen.svg" alt="Pen Icon" id="pen-icon" />
  </div>

  <div id="tools">
    <button id="pen-btn" class="active">Pen</button>
    <button id="eraser-btn">Eraser</button>
    <button id="debug-toggle">Debug</button>
  </div>

  <div id="debug-info">Initializing...</div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script type="module" src="/src/js/mediapipeHands.js"></script>
  <script type="module" src="/src/js/camera.js"></script>
  <script type="module" src="/src/js/app.js"></script>
  <script src="/src/js/debug.js"></script>
</body>
</html>
