<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AirDraw</title>
  <link rel="stylesheet" href="/src/css/styles.css" />
</head>
<body>
  <canvas id="draw-canvas"></canvas>

  <div class="camera-container">
    <video id="webcam-video" autoplay playsinline muted></video>
    <div id="camera-fingers">No hand</div>
  </div>

  <div id="pointer">
    <div id="pointer-circle"></div>
    <img src="./icons/pen.svg" alt="Pen Icon" id="pen-icon" />
  </div>

  <div id="tools">
    <!-- Removed the pen and eraser buttons -->
    <button id="debug-toggle">Debug</button>
    <!-- Voice button will be added by JavaScript -->
  </div>

  <div id="debug-info">Initializing...</div>
  
  <!-- Voice status and color display will be added by JavaScript -->

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script type="module" src="/src/js/colorDatabase.js"></script>
  <script type="module" src="/src/js/mediapipeHands.js"></script>
  <script type="module" src="/src/js/camera.js"></script>
  <script type="module" src="/src/js/voice.js"></script>
  <script type="module" src="/src/js/app.js"></script>
  <script src="/src/js/debug.js"></script>
</body>
</html>
